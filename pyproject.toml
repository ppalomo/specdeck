[project]
name = "specdeck"
version = "0.1.0"
description = "A local dashboard that reads the OpenSpec directories of several repositories at once."
requires-python = ">=3.13"
authors = [{ name = "Pablo Palomo" }]

dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
specdeck = "specdeck.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specdeck"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

# The compiled web interface is a build output, so it is ignored by git. Hatchling honours
# VCS ignore files, so without this it would be left out of the wheel and the packaged
# server would have nothing to serve.
[tool.hatch.build]
artifacts = ["src/specdeck/static/**"]

[tool.ruff]
line-length = 96
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# A broad selection, chosen explicitly rather than with "ALL" so that upgrading ruff adds
# rules on purpose instead of by surprise.
select = [
    "A", "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "D", "DTZ", "E", "EM", "ERA", "EXE",
    "F", "FA", "FBT", "FLY", "FURB", "G", "I", "ICN", "INP", "ISC", "LOG", "N", "PERF",
    "PIE", "PL", "PT", "PTH", "PYI", "Q", "RET", "RSE", "RUF", "S", "SIM", "SLF", "SLOT",
    "T10", "T20", "TC", "TID", "TRY", "UP", "W", "YTT",
]
ignore = [
    "D203",    # Incompatible with D211, which is the style ruff formats to.
    "D213",    # Incompatible with D212, which is the style ruff formats to.
    "COM812",  # Trailing commas are the formatter's business, not the linter's.
    "ISC001",  # Would fight the formatter over implicit string concatenation.
]

[tool.ruff.lint.per-file-ignores]
# A test's name is its documentation, its asserts are the point, and the literals it
# compares against are what it is asserting.
"tests/**" = ["D103", "INP001", "PLR2004", "S101"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
